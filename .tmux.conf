set -g default-terminal "screen-256color"

# mouse on for scrolling
set -g mouse on

# Allows for faster key repetition
set -s escape-time 0

# extended keys
set -g extended-keys on
set -g extended-keys-format csi-u

# reload conf
bind r source-file ~/.tmux.conf \; display "Reloaded .tmux.conf"

# constrain window size to the maximum size of any client connected to that window
setw -g aggressive-resize on

# Start window and pane numbering at 1.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Set status bar
set -g status-bg colour0
set -g status-fg white
set -g status-left-length 20
set -g status-right-length 40
set -g status-left "#[bg=colour0]#[fg=colour4] #h [#[fg=colour15]#I#[fg=colour4]] "
# set -g status-right "#[bg=colour33]#[fg=colour255]#[fg=colour232] #[fg=colour255]#(uptime | awk {'print $8, $9, $10'})#[fg=colour232] #[bg=colour232] #[bg=colour33] #[fg=colour255]#(date '+%H:%M %d-%m-%Y')#[fg=colour232] "
set -g status-right "#[bg=colour0]#[fg=colour255]#[fg=colour232]#[bg=colour0]#[fg=colour149]#(date '+%Y-%m-%d %a %H:%M')"

# Highlight the active tab and show activity/bell notifications.
set -g status-justify left
setw -g window-status-separator ''
setw -g window-status-format '#[fg=colour244,bg=colour0]  #I #[fg=colour250]#W #[fg=colour238]|'
setw -g window-status-current-format '#[fg=colour232,bg=colour39,bold]  #I #[fg=colour255]#W #[fg=colour39] '
setw -g window-status-last-style 'fg=colour0,bg=colour245'
setw -g window-status-activity-style 'fg=colour232,bg=colour214,bold'
setw -g window-status-bell-style 'fg=colour255,bg=colour160,bold'

# Switch tabs and panes with Ctrl+Shift+Arrow.
bind -n C-S-Left previous-window
bind -n C-S-Right next-window
bind -n C-S-Up select-pane -U
bind -n C-S-Down select-pane -D

# Jump directly to tabs 1–9.
bind -n C-1 select-window -t 1
bind -n C-2 select-window -t 2
bind -n C-3 select-window -t 3
bind -n C-4 select-window -t 4
bind -n C-5 select-window -t 5
bind -n C-6 select-window -t 6
bind -n C-7 select-window -t 7
bind -n C-8 select-window -t 8
bind -n C-9 select-window -t 9
